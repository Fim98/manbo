name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Validate signing secrets
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] || { echo "Missing KEYSTORE_BASE64"; exit 1; }
          [ -n "${{ secrets.STORE_PASSWORD }}" ] || { echo "Missing STORE_PASSWORD"; exit 1; }
          [ -n "${{ secrets.KEY_PASSWORD }}" ] || { echo "Missing KEY_PASSWORD"; exit 1; }
          [ -n "${{ secrets.KEY_ALIAS }}" ] || { echo "Missing KEY_ALIAS"; exit 1; }

      - name: Decode Keystore
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/manbo-release.jks
          test -s app/manbo-release.jks

      - name: Create keystore.properties
        run: |
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" > keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "storeFile=../app/manbo-release.jks" >> keystore.properties

      - name: Verify keystore
        shell: bash
        run: |
          set -euo pipefail
          keytool -list -v \
            -keystore app/manbo-release.jks \
            -storepass "${{ secrets.STORE_PASSWORD }}" \
            -alias "${{ secrets.KEY_ALIAS }}"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get tag name
        id: tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set version from tag
        run: echo "VERSION_NAME=${TAG_NAME#v}" >> $GITHUB_ENV
        env:
          TAG_NAME: ${{ steps.tag.outputs.TAG_NAME }}

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: Release ${{ steps.tag.outputs.TAG_NAME }}
          files: app/build/outputs/apk/release/Manbo-release-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
